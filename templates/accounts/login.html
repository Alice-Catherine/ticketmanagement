{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Staff Login</h3>

            {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}

                <div class="form-check mt-2 mb-3">
                    <input type="checkbox" class="form-check-input" id="showPasswordCheck">
                    <label class="form-check-label" for="showPasswordCheck">Show password</label>
                </div>

                <button type="submit" class="btn btn-primary w-100 mt-3">Log In</button>
            </form>

            <p class="text-center mt-3 mb-0">
                <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
            </p>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var passwordField = document.querySelector('input[type="password"]');
    var checkbox = document.getElementById('showPasswordCheck');

    if (passwordField && checkbox) {
        checkbox.addEventListener("change", function () {
            passwordField.type = checkbox.checked ? "text" : "password";
        });
    }
});
</script>
{% endblock %}
