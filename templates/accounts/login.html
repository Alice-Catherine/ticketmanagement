{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 400px;">
        <div class="card-body p-4">
            <h3 class="text-center mb-4">Staff Login</h3>

            {% if form.errors %}
                <div class="alert alert-danger">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Log In</button>
            </form>

            <p class="text-center mt-3 mb-0">
                <a href="{% url 'accounts:password_reset' %}">Forgot password?</a>
            </p>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var passwordField = document.querySelector('input[type="password"]');
    if (passwordField) {
        passwordField.style.paddingRight = "40px";

        var wrapper = document.createElement("div");
        wrapper.style.position = "relative";
        passwordField.parentNode.insertBefore(wrapper, passwordField);
        wrapper.appendChild(passwordField);

        var toggleIcon = document.createElement("span");
        toggleIcon.innerHTML = "&#128065;";
        toggleIcon.style.position = "absolute";
        toggleIcon.style.right = "12px";
        toggleIcon.style.top = "50%";
        toggleIcon.style.transform = "translateY(-50%)";
        toggleIcon.style.cursor = "pointer";
        toggleIcon.style.userSelect = "none";
        wrapper.appendChild(toggleIcon);

        toggleIcon.addEventListener("click", function () {
            if (passwordField.type === "password") {
                passwordField.type = "text";
                toggleIcon.style.opacity = "1";
            } else {
                passwordField.type = "password";
                toggleIcon.style.opacity = "0.5";
            }
        });
    }
});
</script>
{% endblock %}
